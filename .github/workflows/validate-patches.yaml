name: Validate patches

on:
  pull_request:
    branches: [master, beta, stable]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: patch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Lightweight patch validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: validation
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve tooling dependencies
        run: dart pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib tools test
      - name: Analyze Dart tooling
        run: dart analyze --fatal-infos
      - name: Test the validator
        run: dart test
      - name: Validate the complete patch collection
        run: dart run tools/validate_patches.dart

  # Future full-channel application jobs belong here, with needs: lightweight.
  # GitHub then skips those jobs if lightweight validation fails.
