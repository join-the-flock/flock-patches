name: Validate patches

on:
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
    types: [checks_requested]

permissions:
  contents: read

concurrency:
  group: patch-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lightweight:
    name: Lightweight patch validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: patches_validation
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Resolve tooling dependencies
        run: dart pub get --enforce-lockfile
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed bin test
      - name: Analyze Dart tooling
        run: dart analyze --fatal-infos
      - name: Test the validator
        run: dart test
      - name: Validate all channel patch collections
        run: dart run bin/validate.dart

  application:
    name: Patch application (${{ matrix.channel }})
    needs: lightweight
    strategy:
      fail-fast: false
      matrix:
        channel: [master, beta, stable]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLUTTER_REF: ${{ matrix.channel }}
      PATCH_MANIFEST: .patches-${{ matrix.channel }}
    steps:
      # assemble-flock expects Nest's tools/ at the workspace root.
      - name: Check out Nest assembly tooling
        uses: actions/checkout@v6
        with:
          repository: join-the-flock/nest
          ref: main
          persist-credentials: false

      - name: Assemble the proposed patch collection
        uses: ./.github/actions/assemble-flock
        with:
          flutter_ref: ${{ env.FLUTTER_REF }}
          patches_repo: ${{ github.repository }}
          patches_ref: ${{ github.sha }}
          patches_manifest: ${{ env.PATCH_MANIFEST }}
          token: ${{ github.token }}

      - name: Verify the proposed revision and completed import
        shell: bash
        run: |
          test "$(git -C patches rev-parse HEAD)" = "$GITHUB_SHA"
          cmp "patches/$PATCH_MANIFEST" patches/.patches
          cd flock
          git diff --exit-code HEAD --
          test -z "$(git status --porcelain)"
          test ! -d "$(git rev-parse --git-path rebase-apply)"

      - name: Record assembly revisions and diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p patch-application-report
          {
            if [ -e .git ] && git rev-parse --verify HEAD >/dev/null 2>&1; then
              git log -1 --format='Nest revision: %H'
            else
              printf 'Nest revision: unavailable (checkout failed)\n'
            fi
            printf 'Patch repository: %s\n' "$GITHUB_REPOSITORY"
            printf 'Requested patch revision: %s\n' "$GITHUB_SHA"
            printf 'Flutter ref: %s\n' "$FLUTTER_REF"
            printf 'Patch manifest: %s\n' "$PATCH_MANIFEST"
            if [ -e patches/.git ] && git -C patches rev-parse --verify HEAD >/dev/null 2>&1; then
              git -C patches log -1 --format='Checked patch revision: %H'
            fi
            if [ -e flock/.git ] && git -C flock rev-parse --verify HEAD >/dev/null 2>&1; then
              channel="${FLUTTER_REF#refs/heads/}"
              git -C flock log -1 --format='Flutter base revision: %H' \
                "refs/remotes/origin/$channel" || true
              git -C flock log -1 --format='Assembled revision: %H'
              git -C flock status --porcelain
              git -C flock diff --name-only --diff-filter=U
            fi
          } > patch-application-report/revisions.txt
          if [ -f "patches/$PATCH_MANIFEST" ]; then
            cp "patches/$PATCH_MANIFEST" patch-application-report/manifest.txt
          fi
          if [ -d flock/.git/rebase-apply ]; then
            git -C flock am --show-current-patch=raw \
              > patch-application-report/failed-patch.txt || true
          fi
          {
            printf '```text\n'
            cat patch-application-report/revisions.txt
            printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload application report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-application-report-${{ matrix.channel }}
          path: |
            patch-application-report/
            patch_fail.log
          if-no-files-found: warn
          retention-days: 7
